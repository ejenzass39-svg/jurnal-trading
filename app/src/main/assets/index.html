<header><div><b>Jurnal Trading &middot; SMC</b><small id="who"></small></div><div style="display:flex;gap:12px;align-items:center"><div id="md" style="display:flex;gap:4px"></div><div id="bal"></div></div></header>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=(n,d=0)=>n===''||n==null||isNaN(n)?'–':Number(n).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const usc=()=>D&&D.R.mode=='USC',Rp=n=>n===''||n==null||isNaN(n)?'–':(n<0?'-':'')+(usc()?F(Math.abs(n),2)+' USC':'Rp '+F(Math.abs(n))),K=()=>usc()?1:+D.R.kurs,eq=n=>isNaN(n)?'':usc()?'≈ Rp '+F(n/100*D.R.kurs):'≈ '+F(n/D.R.kurs*100,2)+' USC',T=s=>usc()?s.replace(/\(Rp\)/g,'(USC)').replace(/Rp\//g,'USC/').replace(/(Risk|Biaya|broker) Rp/g,'$1 USC'):s,Pc=n=>n==null||isNaN(n)?'–':F(n*100,2)+'%',cl=n=>n>0?'up':n<0?'dn':'';
const sum=a=>a.reduce((s,x)=>s+(+x||0),0),avg=a=>a.length?sum(a)/a.length:0,HARI=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const CKL=['HTF Bias Searah','Liquidity Sweep','BOS / CHoCH','POI (OB / FVG)','Premium / Discount','Killzone'];
let D,TR=[],CL=[],M={},V='dash',flt={q:'',h:'',p:''};
function seed(){const pr=[['EURUSD','Forex Major',.0001,10],['GBPUSD','Forex Major',.0001,10],['AUDUSD','Forex Major',.0001,10],['NZDUSD','Forex Major',.0001,10],['USDCAD','Forex Major',.0001,7.3],['USDCHF','Forex Major',.0001,12.5],['USDJPY','Forex JPY',.01,6.7],['EURJPY','Forex JPY',.01,6.7],['GBPJPY','Forex JPY',.01,6.7],['EURGBP','Forex Cross',.0001,13],['XAUUSD','Komoditas',.1,10],['US30','Indeks',1,1],['NAS100','Indeks',1,1],['BTCUSD','Kripto',1,1]];
return{mode:'IDR',kurs:16500,acc:{IDR:{nid:1,trades:[],setup:{nama:'Nama Anda',modal:165000000,risk:1,rr:2,be:80000,target:10,dd:10,tahun:2026}},USC:{nid:1,trades:[],setup:{nama:'Nama Anda',modal:10000,risk:1,rr:2,be:100,target:10,dd:10,tahun:2026}}},pairs:pr.map(p=>({p:p[0],tipe:p[1],pip:p[2],pv:p[3]})),
lists:{sesi:['Asia','London','New York','Off-Session'],setup:['Liquidity Sweep + OB','CHoCH + FVG','BOS Continuation (OB)','Breaker Block','Mitigation Block','Turtle Soup (Liquidity Grab)','Inversion FVG (IFVG)','Premium/Discount Reversal','Judas Swing (Asia Range)','OB Refined (LTF)'],emosi:['Tenang','Percaya Diri','Fokus','Ragu','Takut','FOMO','Serakah','Revenge','Bosan'],salah:['Tidak Ada','Entry Tanpa Konfirmasi','Entry Terlalu Cepat','Geser SL','Overtrade','Lot Terlalu Besar','Tidak Sesuai Plan','Exit Prematur','Counter Trend HTF','Di Luar Killzone','Entry Saat News'],tf:['M1','M5','M15','M30','H1','H4']}}}
function wrap(R){R.news=Object.assign(JSON.parse(JSON.stringify(NS0)),R.news||{});const a=()=>R.acc[R.mode];return{R,get setup(){return a().setup},get trades(){return a().trades},set trades(v){a().trades=v},get nid(){return a().nid},set nid(v){a().nid=v},get pairs(){return R.pairs},get lists(){return R.lists}}}
function norm(d){if(d&&d.setup&&!d.acc){const s=d.setup,k=s.kurs,x=seed();delete s.kurs;x.kurs=k||16500;x.acc.IDR={setup:s,trades:(d.trades||[]).filter(t=>!String(t.cat).startsWith('CONTOH')),nid:d.nid||1};x.pairs=d.pairs||x.pairs;x.lists=d.lists||x.lists;d=x}return d&&d.acc?d:null}
async function load(){let r=null;try{r=norm(JSON.parse(AndroidBridge.loadData()))}catch(e){}if(!r)try{r=norm(JSON.parse(localStorage.jt))}catch(e){}D=wrap(r||seed())}
let tm;function save(){clearTimeout(tm);tm=setTimeout(()=>{const s=JSON.stringify(D.R);try{localStorage.jt=s}catch(e){}try{AndroidBridge.saveData(s)}catch(e){}},200)}
/* ===== RUMUS PERHITUNGAN PER TRADE ===== */
function calc(t,bal,pm,S){const p=pm[t.pair]||{pip:1,pv:1},k=K(),e=+t.entry,lot=+t.lot,r={...t};
r.hari=HARI[(new Date(t.tgl+'T00:00').getDay()+6)%7];r.skor=(t.c||[]).filter(Boolean).length;r.grade=r.skor==6?'A+':r.skor==5?'A':r.skor==4?'B':'C';
r.rp=Math.round(Math.abs(e-t.sl)/p.pip*100)/100;r.rw=Math.round(Math.abs(t.tp-e)/p.pip*100)/100;r.rr=r.rp?r.rw/r.rp:null;r.riskRp=r.rp*lot*p.pv*k;r.riskPct=bal?r.riskRp/bal:null;
if(t.exit===''||t.exit==null){r.st='Open';return r}
r.pips=Math.round((t.arah=='Buy'?t.exit-e:e-t.exit)/p.pip*100)/100;r.net=t.broker!==''&&t.broker!=null?+t.broker:r.pips*lot*p.pv*k-(+t.biaya||0);
r.R=r.riskRp?r.net/r.riskRp:null;const sd=t.arah=='Buy'?t.sl<e:t.sl>e,so=sd&&(t.arah=='Buy'?t.exit<=t.sl:t.exit>=t.sl),to=t.arah=='Buy'?t.exit>=t.tp:t.exit<=t.tp;
r.st=so&&r.net<0?'Loss':to&&r.net>0?'Win':r.net>S.be?'Win':r.net<-S.be?'Loss':'BE';return r}
function build(){const S=D.setup,pm={};D.pairs.forEach(p=>pm[p.p]=p);let bal=+S.modal,pk=bal,sw=0,sl=0;
TR=[...D.trades].sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:a.id-b.id).map((t,i)=>{const r=calc(t,bal,pm,S);r.no=i+1;
if(r.st!='Open'){bal+=r.net;pk=Math.max(pk,bal);r.bal=bal;r.dd=(pk-bal)/pk;sw=r.st=='Win'?sw+1:0;sl=r.st=='Loss'?sl+1:0}r.sw=sw;r.sl=sl;return r});CL=TR.filter(x=>x.st!='Open');
const c=CL,n=c.length,W=c.filter(x=>x.st=='Win'),L=c.filter(x=>x.st=='Loss'),m={n,w:W.length,l:L.length,be:n-W.length-L.length,open:TR.length-n};
m.gp=sum(c.filter(x=>x.net>0).map(x=>x.net));m.gl=sum(c.filter(x=>x.net<0).map(x=>x.net));m.net=m.gp+m.gl;m.bal=+S.modal+m.net;m.ret=m.net/S.modal;m.wr=n?m.w/n:0;m.pf=m.gl?m.gp/-m.gl:null;
m.aw=avg(W.map(x=>x.net));m.al=avg(L.map(x=>x.net));m.exp=n?m.net/n:0;m.expR=avg(c.map(x=>x.R));m.totR=sum(c.map(x=>x.R));m.rrP=avg(TR.map(x=>x.rr));m.rrR=m.al?m.aw/-m.al:0;
m.best=n?Math.max(...c.map(x=>x.net)):0;m.worst=n?Math.min(...c.map(x=>x.net)):0;m.mdd=n?Math.max(...c.map(x=>x.dd)):0;m.sw=Math.max(0,...c.map(x=>x.sw));m.sl=Math.max(0,...c.map(x=>x.sl));m.pips=sum(c.map(x=>x.pips));m.risk=avg(TR.map(x=>x.riskPct));
const rr=TR.filter(x=>x.rr!=null);m.rrOk=rr.length?rr.filter(x=>x.rr>=S.rr).length/rr.length:0;m.disc=n?c.filter(x=>x.salah=='Tidak Ada').length/n:0;m.gA=TR.length?TR.filter(x=>x.grade<'B').length/TR.length:0;m.skor=avg(TR.map(x=>x.skor));
const d=new Date(),ms=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';m.mNet=sum(c.filter(x=>x.tgl>=ms).map(x=>x.net));m.mTgt=(+S.modal+sum(c.filter(x=>x.tgl<ms).map(x=>x.net)))*S.target/100;m.mProg=m.mTgt>0?m.mNet/m.mTgt:0;
m.ddSt=m.mdd>=S.dd/100?'BAHAYA':m.mdd>=S.dd/100*.7?'WASPADA':'AMAN';M=m}
/* ===== GRAFIK SVG ===== */
function line(v){const W=640,H=190,p=12,mn=Math.min(...v),mx=Math.max(...v),x=i=>p+i*(W-2*p)/Math.max(1,v.length-1),y=a=>H-p-(a-mn)/(mx-mn||1)*(H-2*p),d=v.map((a,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(a).toFixed(1)).join('');
return`<svg viewBox="0 0 ${W} ${H}"><path d="${d}L${x(v.length-1)} ${H}L${x(0)} ${H}Z" fill="#3dd6a31f"/><path d="${d}" fill="none" stroke="var(--up)" stroke-width="2.5"/>${v.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a)}" r="3.5" fill="var(--up)"><title>${F(a)}</title></circle>`).join('')}<text x="${p}" y="12">${F(mx)}</text><text x="${p}" y="${H-2}">${F(mn)}</text></svg>`}
function bars(v){const W=640,H=190,mx=Math.max(1,...v.map(Math.abs)),z=H/2,w=(W-20)/Math.max(v.length,1);
return`<svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--ln)"/>${v.map((a,i)=>{const h=Math.abs(a)/mx*(z-8);return`<rect x="${10+i*w+w*.15}" y="${a>=0?z-h:z}" width="${w*.7}" height="${Math.max(h,1)}" rx="2" fill="${a>=0?'var(--up)':'var(--dn)'}"><title>${F(a)}</title></rect>`}).join('')}</svg>`}
function donut(a){const t=sum(a)||1,C=['var(--up)','var(--dn)','var(--ac)'];let o=0;return`<svg viewBox="0 0 120 120" style="max-width:170px;margin:auto"><circle cx="60" cy="60" r="44" fill="none" stroke="var(--ln)" stroke-width="16"/>${a.map((v,i)=>{const l=v/t*276.5,s=`<circle cx="60" cy="60" r="44" fill="none" stroke="${C[i]}" stroke-width="16" stroke-dasharray="${l} 276.5" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return s}).join('')}<text x="60" y="65" text-anchor="middle" style="fill:var(--tx);font-size:18px;font-weight:700">${sum(a)}</text></svg>`}
/* ===== HALAMAN ===== */
const kp=(l,v,s,c='')=>`<div class="card k"><small>${l}</small><b class="${c}">${v}</b><span>${s}</span></div>`;
function vDash(){const m=M,S=D.setup,last=CL.slice(-30);
return`<h2>Dashboard</h2>${TR.length?'':'<div class="card"><b>Belum ada trade.</b> <span class="mu">Buka menu Jurnal lalu tekan “+ Trade baru” untuk mencatat trade pertama.</span></div>'}<p class="mu" style="margin-top:-8px">Akun ${D.R.mode} · Modal awal ${Rp(S.modal)} · Risk/trade ${S.risk}% · Target RR min 1:${S.rr}</p><div class="g">
${kp('Balance saat ini',Rp(m.bal),'modal '+Rp(S.modal)+' · '+eq(m.bal))}${kp('Net profit',Rp(m.net),'pips '+F(m.pips,1)+' · '+eq(m.net),cl(m.net))}${kp('Return',Pc(m.ret),'terhadap modal awal',cl(m.ret))}${kp('Win rate',Pc(m.wr),`${m.w}W · ${m.l}L · ${m.be}BE`)}
${kp('Profit factor',m.pf==null?'–':F(m.pf,2),'gross profit ÷ gross loss')}${kp('Total trade',m.n,m.open+' posisi open')}${kp('Expectancy (R)',F(m.expR,2),'rata-rata R per trade',cl(m.expR))}${kp('RR realisasi',F(m.rrR,2),'rencana rata-rata '+F(m.rrP,2))}
${kp('Rata-rata win',Rp(m.aw),'per trade win','up')}${kp('Rata-rata loss',Rp(m.al),'per trade loss','dn')}${kp('Max drawdown',Pc(m.mdd),'batas '+S.dd+'% · '+m.ddSt,m.ddSt=='AMAN'?'up':m.ddSt=='WASPADA'?'ac':'dn')}${kp('Streak terpanjang',m.sw+'W / '+m.sl+'L','win / loss beruntun')}</div>
<div class="g2"><div class="card"><h3>Kurva ekuitas</h3>${line([+S.modal,...CL.map(x=>x.bal)])}</div><div class="card"><h3>Net P/L 30 trade terakhir</h3>${bars(last.map(x=>x.net))}</div>
<div class="card"><h3>Win / Loss / BE</h3>${donut([m.w,m.l,m.be])}<p class="n" style="text-align:center"><span class="up">● Win</span> <span class="dn">● Loss</span> <span class="ac">● BE</span></p></div></div>
<div class="g2"><div class="card"><h3>Statistik detail</h3><table>${[['Gross profit',Rp(m.gp),'up'],['Gross loss',Rp(m.gl),'dn'],['Trade terbaik',Rp(m.best),'up'],['Trade terburuk',Rp(m.worst),'dn'],['Total R',F(m.totR,2)],['Expectancy / trade',Rp(m.exp)],['Rata-rata risk / trade',Pc(m.risk)]].map(r=>`<tr><td>${r[0]}</td><td class="${r[2]||''}">${r[1]}</td></tr>`).join('')}</table></div>
<div class="card"><h3>Kedisiplinan & risiko</h3><table>${[['Kepatuhan terhadap rencana',Pc(m.disc)],['Trade dengan RR ≥ target',Pc(m.rrOk)],['Trade grade A / A+',Pc(m.gA)],['Rata-rata skor checklist',F(m.skor,1)+' / 6'],['Status drawdown',m.ddSt],['Net P/L bulan ini',Rp(m.mNet)],['Target profit bulan ini',Rp(m.mTgt)]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
<p class="n" style="margin:10px 0 4px">Progres target bulan ini: ${Pc(m.mProg)}</p><div class="pr"><i style="width:${Math.min(100,Math.max(0,m.mProg*100))}%"></i></div></div></div>
<p class="n">Jurnal ini alat pencatatan & evaluasi, bukan nasihat keuangan. Trading memiliki risiko kerugian.</p>`}

function sv(){const t=cur();if(!t.entry||!t.sl||!t.tp||!t.lot)return alert('Entry, SL, TP, dan Lot wajib diisi.');if(EID)D.trades[D.trades.findIndex(x=>x.id==EID)]=t;else{t.id=D.nid++;D.trades.push(t)}save();$('#dlg').close();render()}

function dl(n,s,t){if(window.AndroidBridge){AndroidBridge.saveFile(n,s);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click()}
function exp_(k){if(k=='json')return dl('jurnal_backup.json',JSON.stringify(D.R,null,1),'application/json');const h=['no','tgl','hari','sesi','pair','arah','tf','setup','skor','grade','entry','sl','tp','exit','lot','rp','rw','rr','riskRp','riskPct','pips','net','R','st','bal','dd','emosi','salah','cat'];dl('jurnal.csv',[h.join(','),...TR.map(t=>h.map(c=>'"'+String(t[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n'),'text/csv')}
function imp(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const x=norm(d);if(!x)throw 0;D=wrap(x);save();render()}catch(e){alert('File JSON tidak valid.')}};r.readAsText(i.files[0])}
/* ===== RENDER ===== */
const IC={pasar:'🌐',dash:'📊',jur:'📒',ana:'📈',tool:'🧮',set:'⚙️',pan:'📖'};const NAV=[['dash','Home'],['jur','Jurnal'],['ana','Analisis'],['pasar','Pasar'],['tool','Alat'],['set','Setup'],['pan','Panduan']];
function render(keep){build();$('#nav').innerHTML=NAV.map(([k,n])=>`<button class="${k==V?'on':''}" onclick="V='${k}';render()"><span>${IC[k]}</span>${n}</button>`).join('');$('#who').textContent='Trader: '+D.setup.nama;$('#md').innerHTML=['IDR','USC'].map(m=>`<button class="bt ${D.R.mode==m?'':'s'}" style="padding:6px 10px" onclick="D.R.mode='${m}';save();render()">${m}</button>`).join('');$('#bal').innerHTML=`<small class="mu" style="font-size:11px;font-weight:400">Balance ${D.R.mode}</small>${Rp(M.bal)}<small class="mu" style="display:block;font-size:11px;font-weight:400">${eq(M.bal)}</small>`;
if(keep&&V=='jur'){const q=flt.q.toLowerCase();$('#rows').innerHTML=(flt.v=='t'?rowsH:cardsH)(fr());return}
$('#app').innerHTML=T({pasar:vPas,dash:vDash,jur:vJur,ana:vAna,tool:vTool,set:vSet,pan:vPan}[V]());$('#fab').style.display=(V=='jur'||V=='dash')?'':'none';if(V=='tool'){['t_u','t_p'].forEach(i=>$('#'+i).onchange=tl);tl()}if(V=='set')document.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{D.setup[i.dataset.k]=i.type=='number'?+i.value:i.value;save();build();$('#who').textContent='Trader: '+D.setup.nama})}
const fr=()=>{const q=flt.q.toLowerCase();return TR.filter(t=>(!flt.h||t.st==flt.h)&&(!flt.p||t.pair==flt.p)&&(!q||(t.setup+t.cat+t.pair+t.emosi+t.salah).toLowerCase().includes(q)))};
const cardsH=rows=>rows.length?[...rows].reverse().map(t=>`<div class="tc t${t.st}" onclick="openForm(${t.id})"><div class="tt"><b>${t.pair}</b><span class="${t.arah=='Buy'?'up':'dn'}">${t.arah}</span><span class="mu">${t.tf} · ${t.tgl}</span><span class="b ${t.st}" style="margin-left:auto">${t.st}</span></div><div class="tm"><span>${esc(t.setup)}</span><span>Grade ${t.grade}</span><span>RR ${F(t.rr,2)}</span><span>${esc(t.emosi)}</span></div><div class="tb"><b class="${cl(t.net)}">${t.st=='Open'?'Open':Rp(t.net)}</b><span class="mu">${t.st=='Open'?'Risk '+Rp(t.riskRp):'R '+F(t.R,2)+' · '+F(t.pips,1)+' pips'}</span></div>${t.link?`<a href="${esc(t.link)}" onclick="event.stopPropagation()">🔗 Screenshot</a>`:''}${t.cat?`<p class="n">${esc(t.cat)}</p>`:''}</div>`).join(''):'<div class="card mu">Belum ada trade. Tekan “+ Trade baru”.</div>';
const vJur0=vJur;vJur=function(){let h=vJur0();if(flt.v!='t')h=h.replace(/<div class="card sc" style="padding:0;max-height:70vh">[\s\S]*?<\/table><\/div>/,()=>'<div id="rows">'+cardsH(fr())+'</div>');
return h.replace('+ Trade baru</button>','+ Trade baru</button><button class="bt s" onclick="flt.v=flt.v==\'t\'?\'c\':\'t\';render()">'+(flt.v=='t'?'Tampilan kartu':'Tabel lengkap')+'</button>')};
/* ===== PASAR: SESI & BERITA ===== */
const ZW='Asia/Jakarta',NS0={col:{L:'#ffffff',M:'#ff9f1a',H:'#ff3b3b'},imp:{L:1,M:1,H:1},cur:[],items:[],t:0,custom:[],scope:'all'},CUR=['USD','EUR','GBP','JPY','AUD','NZD','CAD','CHF','CNY'],IL={L:'Low',M:'Medium',H:'High'};let NS='',NT=0;
const tzp=(tz,ms,o)=>new Intl.DateTimeFormat('en-US',Object.assign({timeZone:tz,hourCycle:'h23'},o)).formatToParts(new Date(ms)).reduce((a,x)=>(a[x.type]=+x.value,a),{});
const tzoff=(tz,ms)=>{const p=tzp(tz,ms,{year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});return(Date.UTC(p.year,p.month-1,p.day,p.hour%24,p.minute,p.second)-Math.floor(ms/1000)*1000)/6e4};
const l2u=(tz,h,m)=>{const p=tzp(tz,Date.now(),{year:'numeric',month:'numeric',day:'numeric'}),g=Date.UTC(p.year,p.month-1,p.day,h,m);return g-tzoff(tz,g)*6e4};
const rng=(tz,a,b,c,d)=>[-1,0,1].map(k=>({s:l2u(tz,a,b)+k*864e5,e:l2u(tz,c,d)+k*864e5}));
const pad=n=>String(n).padStart(2,'0'),hm=(ms,o)=>{const d=new Date(ms+o*36e5);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())},dur=ms=>{const m=Math.max(0,Math.round(ms/6e4));return Math.floor(m/60)+'j '+m%60+'m'};
const sr=(n,loc,Rg,ket)=>{const now=Date.now(),act=Rg.find(x=>now>=x.s&&now<x.e),nx=Math.min(...Rg.map(x=>x.s).concat(Rg.map(x=>x.s+864e5)).filter(x=>x>now)),z=Rg[1];
return`<tr class="${act?'sa':''}"><td class="l"><b>${n}</b>${ket?`<br><small class="mu">${ket}</small>`:''}</td><td>${loc}</td><td>${hm(z.s,0)}–${hm(z.e,0)}</td><td><b>${hm(z.s,7)}–${hm(z.e,7)}</b></td><td>${act?'<span class="b Win">BUKA · sisa '+dur(act.e-now)+'</span>':'<span class="mu">buka '+dur(nx-now)+' lagi</span>'}</td></tr>`};
const mk=(n,tz,a,b,c,d,ket)=>sr(n,pad(a)+':'+pad(b)+'–'+pad(c%24)+':'+pad(d),rng(tz,a,b,c,d),ket),TH='<tr><th>Sesi</th><th>Jam lokal</th><th>UTC</th><th>WIB</th><th>Status</th></tr>';
const NY='America/New_York',LO='Europe/London';
function sesHTML(){const ov=[-1,0,1].map(k=>({s:l2u(NY,8,0)+k*864e5,e:l2u(LO,17,0)+k*864e5}));
return`<div class="sc"><table>${TH}${mk('Sydney','Australia/Sydney',7,0,16,0)}${mk('Asia (Tokyo)','Asia/Tokyo',9,0,18,0,'Sesi Asia')}${mk('London',LO,8,0,17,0)}${mk('New York',NY,8,0,17,0)}${sr('Overlap London–NY','NY 08:00 → LDN 17:00',ov,'Volatilitas tertinggi')}</table></div>`}
function kzHTML(){return`<div class="sc"><table>${TH.replace('Jam lokal','Waktu NY')}${mk('Asia KZ',NY,20,0,24,0)}${mk('London KZ',NY,2,0,5,0)}${mk('New York KZ',NY,7,0,10,0)}${mk('London Close KZ',NY,10,0,12,0)}</table></div>`}
const clk=()=>{const n=Date.now();return`<b style="font-size:22px">${hm(n,7)}</b> WIB &nbsp;·&nbsp; ${hm(n,0)} UTC &nbsp;·&nbsp; ${hm(n,tzoff(NY,n)/60)} New York`};
const dtf=o=>new Intl.DateTimeFormat('en-GB',Object.assign({timeZone:ZW},o));
function newsH(){const N=D.R.news,now=Date.now(),dk=ts=>dtf({year:'numeric',month:'2-digit',day:'2-digit'}).format(ts),ok=e=>!N.cur.length||N.cur.includes(e.cur),all=[...N.items,...N.custom],
L=all.filter(e=>N.imp[e.imp]&&ok(e)&&(N.scope!='today'||dk(e.ts)==dk(now))).sort((a,b)=>a.ts-b.ts),nx=all.filter(e=>e.imp=='H'&&ok(e)&&e.ts>now).sort((a,b)=>a.ts-b.ts)[0];
let h=nx?`<p style="margin:0 0 8px"><b style="color:${N.col.H}">● High berikutnya:</b> ${nx.cur} ${esc(nx.t)} — dalam <b>${dur(nx.ts-now)}</b></p>`:'',last='';
if(!L.length)return h+'<p class="mu">Belum ada berita. Tekan Perbarui (perlu internet) atau tambah manual di Pengaturan berita.</p>';
return h+L.map(e=>{const d=dk(e.ts),hd=d!=last?`<div class="dh">${new Intl.DateTimeFormat('id-ID',{timeZone:ZW,weekday:'long',day:'numeric',month:'short'}).format(e.ts)}</div>`:'';last=d;const c=N.col[e.imp];
return hd+`<div class="nw ${e.ts<now?'ps':''}" style="border-left-color:${c}"><span class="nt">${dtf({hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(e.ts)}</span><span class="nc">${esc(e.cur)}</span><span class="nm"><b>${esc(e.t)}</b>${e.f||e.p?`<small>Forecast ${esc(e.f||'–')} · Previous ${esc(e.p||'–')}</small>`:''}</span><span class="ni" style="background:${c}">${IL[e.imp]}</span></div>`}).join('')}
function vPas(){const N=D.R.news;if(Date.now()-N.t>18e5&&Date.now()-NT>6e4)refreshNews();
return`<h2>Pasar · Sesi & Berita</h2><div class="card"><div id="clk">${clk()}</div></div>
<div class="card"><h3>Sesi pasar forex</h3><div id="ses">${sesHTML()}</div><p class="n">Jam menyesuaikan musim panas/dingin otomatis. Baris hijau = sesi yang sedang buka.</p></div>
<div class="card"><h3>Kill zone SMC</h3><div id="kz">${kzHTML()}</div></div>
<div class="card"><h3>Berita ekonomi (zona WIB)</h3><div class="bar"><button class="bt" onclick="NT=0;D.R.news.t=0;refreshNews();render()">Perbarui</button><button class="bt s" onclick="D.R.news.scope=D.R.news.scope=='today'?'all':'today';save();render()">${N.scope=='today'?'Tampil: Hari ini':'Tampil: Minggu ini'}</button></div><p class="n" id="ns">${NS||(N.t?'Data tersimpan '+dtf({day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(N.t):'Belum ada data.')}</p>${newsH()}</div>
<div class="card"><h3>Pengaturan berita</h3>${['H','M','L'].map(k=>`<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><input type="color" value="${N.col[k]}" style="width:44px;height:34px;padding:0;flex:none" onchange="D.R.news.col.${k}=this.value;save();render()"><b style="flex:1;color:${N.col[k]}">${IL[k]}${k=='H'?' (merah)':k=='M'?' (oranye)':' (putih)'}</b><label class="chip"><input type="checkbox" ${N.imp[k]?'checked':''} onchange="D.R.news.imp.${k}=this.checked?1:0;save();render()"> Tampilkan</label></div>`).join('')}
<p class="n">Mata uang (kosong = semua):</p><div>${CUR.map(c=>`<label class="chip"><input type="checkbox" ${N.cur.includes(c)?'checked':''} onchange="togCur('${c}')"> ${c}</label>`).join('')}</div>
<div class="bar" style="margin-top:8px"><button class="bt s" onclick="D.R.news.col={L:'#ffffff',M:'#ff9f1a',H:'#ff3b3b'};save();render()">Reset warna</button></div>
<h3 style="margin-top:14px">Tambah berita manual (waktu WIB)</h3><div class="fg"><label>Waktu<input id="n_dt" type="datetime-local"></label><label>Mata uang<select id="n_c">${CUR.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Level<select id="n_i"><option value="H">High</option><option value="M">Medium</option><option value="L">Low</option></select></label><label>Judul<input id="n_t"></label></div><div class="bar" style="margin-top:8px"><button class="bt s" onclick="addNews()">+ Tambah</button></div>
${N.custom.map((e,i)=>`<div class="nw" style="border-left-color:${N.col[e.imp]}"><span class="nm"><b>${esc(e.cur)} ${esc(e.t)}</b><small>${dtf({day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(e.ts)} WIB</small></span><button class="bt d" onclick="D.R.news.custom.splice(${i},1);save();render()">Hapus</button></div>`).join('')}
<p class="n">Data berita dari feed kalender Forex Factory (mingguan). Jam ditampilkan dalam WIB. Ini alat bantu; selalu cek sumber resmi.</p></div>`}
function togCur(c){const a=D.R.news.cur,i=a.indexOf(c);i<0?a.push(c):a.splice(i,1);save();render()}
function addNews(){const v=g('n_dt'),t=g('n_t').trim();if(!v||!t)return alert('Isi waktu dan judul.');const ts=Date.parse(v+(v.length==16?':00':'')+'+07:00');D.R.news.custom.push({ts,cur:g('n_c'),t,imp:g('n_i'),f:'',p:''});save();render()}
function refreshNews(){NT=Date.now();if(!window.AndroidBridge||!AndroidBridge.fetchNews){NS='Ambil otomatis hanya di APK. Gunakan berita manual.';return}NS='Mengambil data berita…';AndroidBridge.fetchNews()}
function newsDone(x){try{const a=JSON.parse(x);if(!Array.isArray(a))throw 0;D.R.news.items=a.map(e=>({ts:Date.parse(e.date),cur:e.country,t:e.title,imp:({High:'H',Medium:'M'})[e.impact]||'L',f:e.forecast||'',p:e.previous||''})).filter(e=>!isNaN(e.ts));D.R.news.t=Date.now();NS='Diperbarui '+dtf({hour:'2-digit',minute:'2-digit'}).format(Date.now())+' WIB'}catch(e){NS='Format data berita tidak dikenali.'}save();if(V=='pasar')render()}
function newsFail(m){NS='Gagal mengambil berita ('+m+'). Menampilkan data tersimpan.';if(V=='pasar')render()}
setInterval(()=>{if(V=='pasar'&&$('#clk')){$('#clk').innerHTML=clk();$('#ses').innerHTML=sesHTML();$('#kz').innerHTML=kzHTML()}},15000);
load().then(()=>render());
</script></body></html>
